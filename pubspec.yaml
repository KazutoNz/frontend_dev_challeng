name: rescu
description: "Rescu — a mini surplus-food marketplace. Hiring assessment starter app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management / DI / routing
  get: ^4.6.6

  # UI
  cached_network_image: ^3.3.0
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0
  visibility_detector: ^0.4.0+2

  # Map
  flutter_map: ^5.0.0
  flutter_map_marker_cluster: ^1.2.0
  latlong2: ^0.9.0

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
